name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # pinned: golangci-lint is built with go1.26 and panics on go1.27 stdlib sources
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: go test -race -coverprofile=coverage-unit.out -covermode=atomic ./internal/...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit.out

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: go test -v -race -count=1 -timeout 120s -coverprofile=coverage-e2e.out -covermode=atomic -coverpkg=./internal/... ./tests/e2e
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e
          path: coverage-e2e.out

  coverage:
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-unit.out,coverage-e2e.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: go build -o loki-mcp-server ./cmd/loki-mcp-server

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
